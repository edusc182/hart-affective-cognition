[pytest]
# La suite mide el sistema REAL: los tests importan `tools.run_experiments`
# (que a su vez importa `orchestrator.orchestrator`). Con `pythonpath = .`
# la raiz del proyecto es importable sin trucos de sys.path en cada test.
testpaths = tests
pythonpath = .
addopts = -q
markers =
    integration: requiere JDK + clases compiladas + display (Java como proceso externo)

